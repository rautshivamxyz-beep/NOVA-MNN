name: Patch MNN AAR (bundle libc++_shared)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK 27.2
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Add libc++_shared.so to the AAR
        run: |
          NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          LIB="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -f "$LIB" || { echo "libc++_shared.so not found in NDK"; exit 1; }
          cd android/app/libs
          rm -rf /tmp/zstaging && mkdir -p /tmp/zstaging/jni/arm64-v8a
          cp "$LIB" /tmp/zstaging/jni/arm64-v8a/
          (cd /tmp/zstaging && zip -q "$GITHUB_WORKSPACE/android/app/libs/mnn-release.aar" jni/arm64-v8a/libc++_shared.so)
          unzip -l mnn-release.aar | grep -E "libMNN|libnova|libc\+\+_shared"

      - name: Commit
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/libs/mnn-release.aar
          git commit -m "AAR: bundle libc++_shared.so (fixes UnsatisfiedLinkError on model load)"
          git push
