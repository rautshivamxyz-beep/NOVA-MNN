name: Sync from NOVA
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Copy NOVA and rename app
        run: |
          set -e
          # clone OUTSIDE the workspace so the wipe below cannot delete it
          git clone -q --depth 1 https://github.com/rautshivamxyz-beep/NOVA.git /tmp/nova-src
          rm -rf /tmp/nova-src/.git /tmp/nova-src/tmp
          rm -f /tmp/nova-src/.github/workflows/restore-main.yml /tmp/nova-src/.github/workflows/update-engine.yml /tmp/nova-src/.github/workflows/build-aar.yml
          # wipe everything here except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/nova-src/. .
          # parallel-installable sibling: different appId + launcher name
          sed -i "s/applicationId 'org.nova'/applicationId 'org.nova.mnn'/" android/app/build.gradle
          sed -i 's|<string name="app_name">NOVA</string>|<string name="app_name">NOVA MNN</string>|' android/app/src/main/res/values/strings.xml
      - name: Commit
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add -A
          git commit -m "NOVA v5.4.1 baseline copy (llama.cpp engine) - MNN port starting point"
          git push
