name: Apply MNN source fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        run: python3 tmp/mnn/apply_fix3.py

      - name: Verify
        run: |
          echo "d65bff402ae56111ea56c1dc2ce23924  android/app/src/main/java/org/nova/ModelsActivity.kt" | md5sum -c -

      - name: Commit
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/ModelsActivity.kt
          git commit -m "ModelsActivity: Import downloaded MNN folder (SAF tree picker) + URL hint"
          git push
