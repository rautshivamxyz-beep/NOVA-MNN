name: Apply MNN source fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        run: python3 tmp/mnn/apply_fix2.py

      - name: Verify
        run: |
          echo "c657085af83e5214df92652dac89dbb0  android/app/src/main/java/org/nova/ModelsActivity.kt" | md5sum -c -

      - name: Commit
        run: |
          git config user.name "rautshivamxyz-beep"
          git config user.email "rautshivamxyz@gmail.com"
          git add android/app/src/main/java/org/nova/ModelsActivity.kt
          git commit -m "Catalog size display: one decimal (0.5 GB not 0 GB)"
          git push
